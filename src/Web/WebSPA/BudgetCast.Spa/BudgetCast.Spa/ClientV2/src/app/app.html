<main
  class="main"
  style="
    display: flex;
    min-height: 100%;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  "
>
  <div
    style="
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      text-align: center;
    "
  >
    <h1>hey angular</h1>
    <button
      id="auth-test-btn"
      type="button"
      aria-label="Test Auth Service"
      (click)="onAuthTestClick()"
      style="
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 500;
        color: white;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      "
      onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 12px rgba(0, 0, 0, 0.15)'"
      onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 6px rgba(0, 0, 0, 0.1)'"
    >
      Test Auth
    </button>

    <app-env-demo />
  </div>
</main>

<router-outlet />
